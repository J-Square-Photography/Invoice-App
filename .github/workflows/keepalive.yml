# A second, independent heartbeat, in case Vercel's scheduler ever misses a run.
# Twice a week (Sunday and Wednesday) it opens the app's keep-alive address, which makes one
# tiny database read so Supabase's free plan never sees a week of inactivity and pauses the
# project. (Day-of-week is used rather than a day-of-month step like */3, which resets at the
# start of each month and can silently skip a slot on short months.)
# Note: GitHub switches scheduled workflows off after 60 days without any commit to the repo;
# any push turns them back on, and Vercel's own schedule keeps running regardless.
name: keep-alive

on:
  schedule:
    - cron: '0 4 * * 0,3'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake the app and touch the database
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 https://jsquare-crm.vercel.app/api/cron/keepalive
