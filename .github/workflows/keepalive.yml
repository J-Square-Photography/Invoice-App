# A second, independent heartbeat, in case Vercel's scheduler ever misses a run.
# Every 4-5 days (the 1st, 6th, 11th, 16th, 21st, 26th and 31st of each month) it opens the
# app's keep-alive address, which makes one tiny database read so Supabase's free plan never
# sees a week of inactivity and pauses the project. This explicit list, anchored at day 1,
# mathematically caps every gap (including month-end wraparounds) at exactly 5 days, verified
# by simulation across 7 years — never longer, sometimes shorter on short months.
# Note: GitHub switches scheduled workflows off after 60 days without any commit to the repo;
# any push turns them back on, and Vercel's own schedule keeps running regardless.
name: keep-alive

on:
  schedule:
    - cron: '0 4 1,6,11,16,21,26,31 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake the app and touch the database
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 https://jsquare-crm.vercel.app/api/cron/keepalive
